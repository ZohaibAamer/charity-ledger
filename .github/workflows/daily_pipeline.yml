name: Data Pipeline (6h)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DUCKDB_PATH: data/charity_ledger.duckdb
  RAW_DATA_PATH: data/raw

jobs:
  extract:
    name: Extract data sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e .

      - name: Create data directory
        run: mkdir -p data/raw

      - name: Run extractions
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: python -m extract.run_all

      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-warehouse
          path: data/charity_ledger.duckdb
          retention-days: 7

  transform:
    name: dbt build and test
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e .

      - name: Download DuckDB artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb-warehouse
          path: data/

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      - name: Run dbt build (models + tests)
        working-directory: dbt_project
        run: dbt build --profiles-dir .

      - name: Generate data quality report
        working-directory: dbt_project
        run: dbt run-operation generate_data_quality_report --profiles-dir .

      - name: Upload transformed DuckDB
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-transformed
          path: data/charity_ledger.duckdb
          retention-days: 30

  quality-report:
    name: Publish quality report
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e .

      - name: Download transformed DuckDB
        uses: actions/download-artifact@v4
        with:
          name: duckdb-transformed
          path: data/

      - name: Generate quality report
        run: |
          python <<'EOF'
          import duckdb

          con = duckdb.connect("data/charity_ledger.duckdb", read_only=True)
          total, avg_score, min_score, max_score = con.execute(
              "SELECT count(*), round(avg(health_score), 1), "
              "min(health_score), max(health_score) "
              "FROM gold.charity_health_scorecard"
          ).fetchone()
          con.close()

          print("=== CHARITY LEDGER QUALITY REPORT ===")
          print(f"Charities scored: {total}")
          print(f"Avg health score: {avg_score}")
          print(f"Score range: {min_score} - {max_score}")
          EOF

      - name: Create run summary
        run: |
          echo "## Daily Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts**: DuckDB warehouse uploaded (30-day retention)" >> $GITHUB_STEP_SUMMARY

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint Python and SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff sqlfluff

      - name: Ruff lint
        run: ruff check extract/

      - name: Ruff format check
        run: ruff format --check extract/

      - name: SQLFluff lint
        run: sqlfluff lint dbt_project/models

  compile:
    name: dbt compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: dbt parse
        working-directory: dbt_project
        run: |
          dbt deps
          dbt parse --profiles-dir .

name: bronze_data_contract
version: "1.1"
description: >
  Data contract for bronze layer tables. These are raw extracts
  with minimal transformation, so columns carry the source system's
  own names. All tables must include extraction metadata columns.

tables:
  cc_charities:
    required_columns:
      - registered_charity_number
      - charity_name
      - charity_registration_status
      - _extracted_at
      - _source
    freshness:
      max_age_hours: 48

  cc_finances:
    required_columns:
      - registered_charity_number
      - fin_period_end_date
      - total_gross_income
      - total_gross_expenditure
      - _extracted_at
      - _source
    freshness:
      max_age_hours: 48

  cc_trustees:
    required_columns:
      - registered_charity_number
      - trustee_name
      - individual_id
      - _extracted_at
      - _source
    freshness:
      max_age_hours: 48

  ch_companies:
    required_columns:
      - CompanyNumber
      - CompanyName
      - CompanyStatus
      - _extracted_at
      - _source
    freshness:
      max_age_hours: 168

  gn_grants:
    required_columns:
      - id
      - amountAwarded
      - _extracted_at
      - _source
    freshness:
      max_age_hours: 168

[project]
name = "charity-ledger"
version = "0.1.0"
description = "UK Charity Financial Health Data Warehouse"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

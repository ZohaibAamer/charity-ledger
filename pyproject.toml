[project]
name = "charity-ledger"
version = "0.1.0"
description = "UK Charity Financial Health Data Warehouse"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]
snowflake = [
    "snowflake-connector-python>=3.6",
    "connectorx>=0.3",
]
azure = [
    "adlfs>=2024.2",
    "azure-identity>=1.15",
    "deltalake>=0.18",
]
aws = [
    "s3fs>=2024.2",
    "boto3>=1.34",
    "deltalake>=0.18",
]
all = [
    "charity-ledger[snowflake,azure,aws]",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "DTZ", # timezone-aware datetimes
]

[tool.ruff.lint.isort]
known-first-party = ["extract"]
